<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Partstore Cabinet</title>
<style>
:root { --paper:#f7f6f2; --ink:#17181a; --ink2:#5b6470; --line:#d9d7cf; --none:#e6e4de; --have:#ffffff; --bad:#f8d7d7; --bad2:#c0392b; --accent:#d8641f; --bin:#2f6db5; --drop:#dff3df; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.3 system-ui, sans-serif; display:flex; flex-direction:column; }
header { display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
h1 { font-size:18px; margin:0; font-weight:600; }
h2 { font-size:15px; margin:18px 0 8px; font-weight:600; color:var(--ink2); }
button { font:inherit; padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
button:disabled { opacity:.45; cursor:default; }
#status { color:var(--ink2); font-size:13px; }
.legend { color:var(--ink2); font-size:13px; display:flex; gap:14px; flex-wrap:wrap; }
.legend .badge { display:inline-block; font-size:11px; font-weight:600; padding:0 6px; border-radius:8px; margin-right:4px; }   /* a category, drawn like its drawer-number labels */
.legend i { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--line); }
/* the cabinets and the unassigned list scroll independently, so either can be lined up against the other */
main { display:flex; gap:16px; padding:0 14px; flex:1; min-height:0; }
#left { flex:1; min-width:0; overflow:auto; padding:14px 4px 14px 0; }
#right { overflow:auto; padding:14px 0; }
#right h2 { position:sticky; top:0; background:var(--paper); margin:0; padding:0 0 8px; z-index:1; }
.cabinet { border:2px solid var(--ink2); border-radius:10px; padding:10px; margin-bottom:16px; }
.cabinet h2 { margin:0 0 8px; }
.grid { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
.grid.k4x4 { grid-template-columns:repeat(4, 1fr); max-width:700px; }
.grid.k4x4w { grid-template-columns:2fr repeat(4, 1fr) 2fr; grid-template-rows:repeat(12, auto); max-width:1000px; }
.grid.k4x4w .drawer { grid-row:span 3; }
.grid.k4x4w .drawer.wide { grid-row:span 4; }
.grid.kbins6x4, .grid.kbins6x2 { grid-template-columns:repeat(6, 1fr); }
.grid.kbins4x3 { grid-template-columns:repeat(4, 1fr); max-width:900px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; }
.tab { padding:5px 10px; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; font-size:13px; }
.tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
#settings { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:15; width:max-content; max-width:calc(100vw - 28px); box-sizing:border-box; font-size:13.5px; max-height:calc(100vh - 70px); overflow:auto; }   /* as wide as its rows need; scrolls only when the window is too small for it. Opens under its button (placeSettings) */
#settings h3 { margin:8px 0 4px; font-size:13px; color:var(--ink2); }
#settings table { border-collapse:collapse; width:100%; }
#settings td { padding:3px 4px; white-space:nowrap; }
#settings tr.hd td { color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding-bottom:0; }
#settings input[type=color] { width:30px; height:22px; padding:1px; vertical-align:middle; cursor:pointer; }
#settings input, #settings select { font:inherit; padding:3px 5px; border:1px solid var(--line); border-radius:4px; }
#settings .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
#settings .note { color:var(--ink2); font-size:12px; }
#settings div.note { white-space:normal; max-width:560px; }
.drawer .n { background:var(--cab, var(--ink2)); color:var(--cabfg, #fff); padding:1px 5px; border-radius:8px; }
.drawer.none { background:#efeeea; }
.legend .cab { display:inline-block; width:14px; height:14px; border-radius:7px; vertical-align:-2px; margin-right:4px; }
.drawer { background:var(--none); border-radius:6px; min-height:92px; position:relative; display:grid; grid-auto-rows:minmax(46px, 1fr); }   /* two equal halves; one label per half, so every drawer is the same size */
.drawer .n { position:absolute; top:3px; right:5px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; pointer-events:none; z-index:1; }
.half { padding:5px 6px 4px; border-radius:6px; display:flex; flex-direction:column; gap:3px; }
.half[data-h="front"] { border-top:1px dashed var(--line); }   /* rear above the line, front below, like the drawer */
.half.whole { border-top:0; }
.half.over { background:var(--drop); outline:2px solid #8fcf8f; }
.half.ins { box-shadow:inset 0 4px 0 var(--accent); }   /* insertion bar: drop here to insert at this half, shifting what is in it along */
.card.over { outline:2px solid #8fcf8f; background:var(--drop); }   /* drop on a card: merge into its label */
.half.gap { background:var(--bad); }
.card { background:var(--have); border:1px solid var(--line); border-radius:5px; padding:3px 6px; font-size:12.5px; cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.06); position:relative; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card:active { cursor:grabbing; }
.card.dragging { opacity:.4; }
.card.ov { font-style:italic; color:var(--ink2); }
.card.ov::after { content:' (overflow)'; font-size:11px; }
.card.gap { border-color:var(--bad2); color:var(--bad2); font-weight:600; }
.card.whole { border-width:2px; border-color:var(--ink2); }
.card.tape .pg { color:inherit; opacity:.75; }
.card .pg { display:block; font-size:10px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; }
.card.cat { border-left:5px solid var(--cat); }   /* unassigned: the category the card belongs to, in its colour */
.card .pg.list { color:var(--accent); }
#right { width:250px; flex:none; }
#right > h2 { margin-top:0; }
#unassigned { min-height:120px; background:var(--none); border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:4px; }
#unassigned.over { background:var(--drop); outline:2px solid #8fcf8f; }
.bins { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:6px; }
.bin { background:var(--none); border-radius:6px; padding:6px 8px 6px 8px; position:relative; min-height:44px; display:flex; flex-direction:column; gap:3px; }
.bin.over { background:var(--drop); outline:2px solid #8fcf8f; }
.bin .n { position:absolute; top:3px; right:5px; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--bin); color:#fff; padding:1px 5px; border-radius:8px; pointer-events:none; z-index:1; }   /* above the card, like a drawer's number */
.bin .card { padding-right:36px; }   /* the card's text stops short of the bin number */
.bin.new { border:1px dashed var(--line); color:var(--ink2); justify-content:center; align-items:center; }
#menu { position:fixed; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.16); display:none; z-index:20; min-width:220px; font-size:13.5px; padding:4px 0; }
#menu div { padding:6px 12px; cursor:pointer; }
#menu div:hover { background:var(--paper); }
#menu div.hd { color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; cursor:default; padding-top:8px; }
#menu div.hd:hover { background:none; }
#menu div.dis { color:var(--line); cursor:default; }
#menu .sub { padding-left:24px; }
@media (max-width:900px) { .grid { grid-template-columns:repeat(4, 1fr); } main { flex-direction:column; overflow:auto; } #left, #right { overflow:visible; } #right { width:auto; } }
</style>
</head>
<body>
<header><h1>Partstore cabinet</h1>
  <span class="tabs" id="tabs"></span>
  <button id="undo" disabled title="undo the last move or shift (⌘Z / Ctrl+Z)">Undo</button>
  <button id="setupBtn" title="cabinets, categories, label sizes and colours">Cabinets…</button>
  <button id="findBtn" title="list screws by drive, material, finish, head… and move the ticked ones">Find</button>
  <span id="status"></span>
  <span class="legend" id="cablegend"></span>
  <span class="legend"><span><i style="background:var(--none)"></i>empty</span><span><i style="background:var(--have)"></i>a label</span><span><i style="background:var(--bad);border-color:var(--bad2)"></i>lengths not contiguous</span><span>drag cards between halves, bins and the unassigned list · right-click a card or a half for more</span></span>
</header>
<main>
  <div id="left">
    <div id="cabinets"></div>
    <h2 id="binsTitle">Bins (18 mm labels)</h2><div class="bins" id="bins"></div>
  </div>
  <div id="right"><h2>Unassigned</h2><div id="unassigned"></div></div>
</main>
<div id="menu"></div>
<div id="settings"></div>
<script src="/model.js"></script>
<script src="/print.js"></script>
<script>
let data, cab, labels = {}, undoStack = [];
// which physical cabinets are shown: any combination, remembered in this browser (all of them until a toggle is turned off)
const hidden = new Set((() => { try { return JSON.parse(localStorage.getItem('cabinetsHidden') || '[]'); } catch (e) { return []; } })());
const rememberHidden = () => { try { localStorage.setItem('cabinetsHidden', JSON.stringify([...hidden])); } catch (e) {} };
const $ = s => document.querySelector(s);
const status = t => { $('#status').textContent = t; };
// per-slot display split: 'cell' | 'type' | 'item' (session only; nothing in the data changes until a piece is dragged)
const splitMode = {};
const slotKey = loc => loc.kind === 'bin' ? `B:${loc.bin}` : `D:${loc.cabinet || ''}:${loc.drawer}|${loc.half || ''}`;
const cabOf = id => cab.cabinets.find(c => c.id === id);

// ---- loading ----
M.bind(() => data);   // the model's categories are this page's data
async function load() {
  const [d, c, ic] = await Promise.all([fetch('/api/data').then(r => r.json()), fetch('/api/cabinet').then(r => r.json()), fetch('/api/icons').then(r => r.json())]);
  data = d; cab = normalize(c); labels = ic.labels || {}; render();
}
// an undivided assignment (no rear/front recorded) that is not flagged as needing the whole drawer is shown, and shifted,
// as the rear half; only flagged cards take the whole drawer
function normalize(c) {
  for (const cabinet of c.cabinets) for (const dr of Object.values(cabinet.drawers)) {
    const legacy = dr.whole.filter(e => !e.whole); if (!legacy.length) continue;
    dr.whole = dr.whole.filter(e => e.whole); dr.back.push(...legacy.map(e => ({ ...e, undivided: true })));
  }
  return c;
}
async function commit(what) {
  status('saving…');
  const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  if (r.status === 409) { undoStack.length = 0; $('#undo').disabled = true; alert('The data changed elsewhere; reloading. Please redo that change.'); await load(); return false; }
  if (!r.ok) { status('save failed'); alert('Save failed'); return false; }
  data.rev = (await r.json()).rev;
  cab = normalize(await (await fetch('/api/cabinet')).json()); render(); status(what || 'saved'); return true;
}
function snapshot() { undoStack.push(JSON.stringify(data)); if (undoStack.length > 30) undoStack.shift(); $('#undo').disabled = false; }
async function undo() { if (!undoStack.length) return; const prev = JSON.parse(undoStack.pop()); prev.rev = data.rev; data = prev; $('#undo').disabled = !undoStack.length; await commit('undone'); }
$('#undo').onclick = undo;
$('#findBtn').onclick = () => window.open('find.html', '_blank');
// ⌘Z / Ctrl+Z undoes the last move or shift (outside text fields)
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/^(input|textarea|select)$/i.test(e.target.tagName)) { e.preventDefault(); undo(); } });

// ---- the objects a part's location lives on ----
const pageOf = id => data.pages.find(p => p.id === id);
const RANK = { '': 0, cell: 1, type: 2, item: 3 };
function objectAt(pageId, part, level) {
  const p = pageOf(pageId); if (!p) return null;
  if (M.isList(p)) return M.listItem(p, part.key);
  const c = p.cells[part.key]; if (!c) return null;
  if (level === 'cell') return c;
  c.detail = c.detail || {}; const o = c.detail[part.type] = c.detail[part.type] || {};
  if (level === 'type') return o;
  o.items = o.items || {}; return o.items[`${part.drive}|${part.material}`] = o.items[`${part.drive}|${part.material}`] || {};
}
// move a card: every part gets `loc` written at the finer of its own level and the card's grain (null loc = unassign)
function setCardLoc(card, loc) {
  // several parts of a card (head types, drive + material) can take their location from the same object (their cell, say):
  // that object is moved once, or its overflow list would gain the new location once per part
  const moved = { true: new Set(), false: new Set() };
  for (const part of card.parts) {
    const level = RANK[part.level] > RANK[card.grain] ? part.level : card.grain;
    const o = objectAt(part.pageId || card.pageId, part, level || 'cell'); if (!o || moved[!!part.overflow].has(o)) continue;
    moved[!!part.overflow].add(o);
    if (part.overflow) {
      const old = card.from ? slotKey(card.undivided ? { ...card.from, half: '' } : card.from) : null;
      // a stored drawer location leaves out the page's own cabinet; card.from and loc always name theirs
      const home = pageOf(part.pageId || card.pageId).cabinet || '', slotIn = l => { const x = M.locOf({ loc: l }) || {}; return slotKey(x.kind === 'drawer' ? { ...x, cabinet: x.cabinet || home } : x); };
      o.overflow = (o.overflow || []).filter(l => !old || slotIn(l) !== old);
      if (loc) { const l = { ...loc }; if (l.cabinet === (pageOf(part.pageId || card.pageId).cabinet || '')) delete l.cabinet; if (!o.overflow.some(x => slotIn(x) === slotIn(loc))) o.overflow.push(l); } if (!o.overflow.length) delete o.overflow;
    } else {
      delete o.drawer; delete o.half;
      if (loc) { o.loc = { ...loc }; if (o.loc.cabinet === (pageOf(part.pageId || card.pageId).cabinet || '')) delete o.loc.cabinet; } else delete o.loc;
    }
  }
}
function setWhole(card, on) { for (const part of card.parts) { const o = objectAt(part.pageId || card.pageId, part, 'cell'); if (o) { if (on) o.whole = true; else delete o.whole; } } }

// ---- cards: one per label, or the pieces of a split slot ----
const short = { drive: d => M.DRIVE_SHORT[d] || d, mat: m => M.matShort(m) };
function cardsOf(entries, loc) {
  const mode = loc ? splitMode[slotKey(loc)] : '';
  const out = [];
  for (const e of entries) {
    const base = { from: loc, overflow: e.overflow, whole: e.whole, gap: e.gap, page: e.page, pageId: e.pageId, list: M.isList(pageOf(e.pageId)), undivided: !!e.undivided };
    if (!mode) { out.push({ ...base, grain: '', text: e.text, parts: e.parts }); continue; }
    const groups = new Map();
    for (const part of e.parts) {
      const k = mode === 'cell' ? `${part.pageId}\n${part.key}` : mode === 'type' ? `${part.pageId}\n${part.key}\n${part.type}` : `${part.pageId}\n${part.key}\n${part.type}\n${part.drive}|${part.material}`;
      if (!groups.has(k)) groups.set(k, []); groups.get(k).push(part);
    }
    for (const [k, parts] of groups) {
      const pt = parts[0], p = pageOf(pt.pageId || e.pageId); let text = M.cellText(p, pt.key);
      if (mode !== 'cell' && pt.type) text += ' · ' + (labels[pt.type] || pt.type);
      if (mode === 'item') text += ' · ' + [pt.drive && short.drive(pt.drive), pt.material && short.mat(pt.material)].filter(Boolean).join(' ');
      out.push({ ...base, grain: mode, text, parts, page: p.title, pageId: p.id });
    }
  }
  return out;
}
// ---- slots: rear/front halves in order; a whole-drawer card takes both halves of its drawer ----
const N = c => (M.positions(data).ranges.find(r => r.id === c.id) || { count: 0 }).count;   // a category's drawers are a run of physical positions
const idx = (drawer, half) => (drawer - 1) * 2 + (half === 'front' ? 1 : 0);
const locAt = (cabId, i, whole) => ({ kind: 'drawer', cabinet: cabId, drawer: String(Math.floor(i / 2) + 1), half: whole ? '' : (i % 2 ? 'front' : 'back') });
// units of one cabinet: the cards that share a slot move together; size 2 = a whole drawer
function units(cabId) {
  const out = [], c = cabOf(cabId);
  for (const [n, dr] of Object.entries(c.drawers)) {
    const d = +n, at = half => ({ kind: 'drawer', cabinet: cabId, drawer: n, half });
    if (dr.whole.length) out.push({ start: idx(d, 'back'), size: 2, cards: cardsOf(dr.whole, at('')) });
    if (dr.back.length) out.push({ start: idx(d, 'back'), size: 1, cards: cardsOf(dr.back, at('back')) });
    if (dr.front.length) out.push({ start: idx(d, 'front'), size: 1, cards: cardsOf(dr.front, at('front')) });
  }
  return out.sort((a, b) => a.start - b.start);
}
const covers = (u, i) => i >= u.start && i < u.start + u.size;
// shift `moved` (in slot order) by `delta` halves, keeping the gaps between them; a whole-drawer unit that would land on a
// front half moves one more, and anything behind it moves up as needed. `floor` is the first index a unit may land on.
// Returns the index after the last unit.
function shift(moved, delta, floor) {
  let prevEnd = floor;
  for (const u of moved) { let to = Math.max(u.start + delta, prevEnd); if (u.size === 2 && to % 2) to++; u.to = to; prevEnd = to + u.size; }
  return prevEnd;
}
const rowEnd = i => Math.floor(i / 16) * 16 + 15;
// the shift plans. Each returns { moved: [units with .to], error } — nothing is written until apply()
function planInsert(all, i, range, size = 1, limit = Infinity) {
  const chainFrom = j => { const out = []; let k = j; for (;;) { const u = all.find(x => covers(x, k) && !out.includes(x)); if (!u) break; out.push(u); k = u.start + u.size; } return out; };
  let moved;
  if (range === 'gap') {
    moved = chainFrom(i); let end = shift(moved, size, i + size);
    for (;;) {   // a whole unit bumped onto a drawer boundary may now overlap something further on: that chain moves too
      const hit = all.find(u => !moved.includes(u) && moved.some(m => m.to < u.start + u.size && u.start < m.to + m.size));
      if (!hit) break; moved.push(...chainFrom(hit.start).filter(u => !moved.includes(u))); moved.sort((a, b) => a.start - b.start); end = shift(moved, size, i + size);
    }
    if (end > limit) return { error: 'No room: the last drawer of this category is in use.' };
  } else if (range === 'row') {
    moved = all.filter(u => u.start >= i && u.start <= rowEnd(i));
    if (shift(moved, size, i + size) > Math.min(rowEnd(i) + 1, limit)) return { error: 'That row has no room: its last half is in use.' };
  } else { moved = all.filter(u => u.start >= i); if (shift(moved, size, i + size) > limit) return { error: 'No room: the last drawer of this category is in use.' }; }
  return { moved: moved.filter(u => u.to !== u.start) };
}
function planDelete(all, i, range) {
  if (all.some(u => covers(u, i))) return { error: 'That space is not empty.' };
  let moved;
  if (range === 'gap') { moved = []; let k = i + 1; for (;;) { const u = all.find(x => covers(x, k)); if (!u) break; moved.push(u); k = u.start + u.size; } }
  else if (range === 'row') moved = all.filter(u => u.start > i && u.start <= rowEnd(i));
  else moved = all.filter(u => u.start > i);
  shift(moved, -1, i);
  return { moved: moved.filter(u => u.to !== u.start) };
}
function describe(cabId, moved) { return moved.map(u => `${M.locText(locAt(cabId, u.start, u.size === 2), cabId)}→${M.locText(locAt(cabId, u.to, u.size === 2), cabId)}`).join(', '); }
async function apply(cabId, plan, then, what) {
  if (plan.error) return alert(plan.error);
  if (plan.moved.length && !confirm(`This moves ${plan.moved.length} label${plan.moved.length === 1 ? '' : 's'} in the ${cabOf(cabId).title.replace(/ screws$/, '')} cabinet: ${describe(cabId, plan.moved)}. Go ahead?`)) return;
  snapshot();
  for (const u of plan.moved) for (const card of u.cards) setCardLoc(card, locAt(cabId, u.to, u.size === 2));
  if (then) then();
  await commit(what);
}

// ---- drag and drop ----
let dragging = null;
function makeCard(card) {
  const el = document.createElement('div'); el.className = 'card' + (card.overflow ? ' ov' : '') + (card.gap ? ' gap' : '') + (card.whole ? ' whole' : '');
  el.draggable = true; el.innerHTML = `${card.text}<span class="pg${card.list ? ' list' : ''}">${card.page}</span>`;
  // a card is drawn like its label: in the tape colours of the cabinet or box it is in, when those are not black on white
  if (card.from) { const z = M.labelSpec(data, card.from); if (!M.plainTape(z)) { el.style.background = z.bg; el.style.color = z.fg; el.classList.add('tape'); } }
  if (!card.from) { const c = M.cabinetById(pageOf(card.pageId)?.cabinet); if (c) { el.classList.add('cat'); el.style.setProperty('--cat', c.color); } }
  el.ondragstart = e => { dragging = card; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
  el.ondragend = () => { dragging = null; el.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); };
  el.oncontextmenu = e => { e.preventDefault(); cardMenu(card, e.clientX, e.clientY); };
  return el;
}
function dropZone(el, onDrop) {
  el.ondragover = e => { if (!dragging) return; e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = e => { e.preventDefault(); el.classList.remove('over'); if (dragging) onDrop(dragging, e); };
}
// a drawer half: empty → place; occupied → the top edge is an insertion bar (insert, shifting what is there), anywhere else
// highlights the card under the pointer and drops as a merge into that label
function halfZone(z, occupied, onDrop) {
  const modeAt = e => { if (!occupied) return 'place'; const r = z.getBoundingClientRect(); return (e.clientY - r.top) < Math.max(12, r.height * 0.3) ? 'insert' : 'merge'; };
  const clear = () => { z.classList.remove('ins', 'over'); z.querySelectorAll('.card.over').forEach(c => c.classList.remove('over')); };
  z.ondragover = e => {

  for (const id of ids) bg.appendChild(binEl(id, cab.bins[id]));
  const nb = document.createElement('div'); nb.className = 'bin new'; nb.textContent = 'drop here for a new bin';
  dropZone(nb, card => { const v = prompt('Loose bin number', String((ids.length ? Math.max(...ids.map(x => parseInt(x.slice(1)) || 0)) : 0) + 1)); if (!v) return; const l = M.parseLoc(/^[a-z]/i.test(v) ? v : 'B' + v); if (!l || l.kind !== 'bin') return alert('Use a number, e.g. 4'); dropOnBin(card, l.bin); });
  bg.appendChild(nb);
  const ua = $('#unassigned'); ua.innerHTML = '';
  for (const card of cardsOf(cab.unassigned, null)) ua.appendChild(makeCard(card));
  if (!cab.unassigned.length) ua.innerHTML = '<span style="color:var(--ink2);font-size:12px">everything has a place</span>';
  dropZone(ua, dropUnassign);
}
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
// the server announces every save (from the grid, another tab, or this page): reload unless the revision is already ours
let events; function listen() {
  try { events = new EventSource('/api/events'); } catch (e) { return; }
  events.onmessage = e => { if (data && +e.data !== data.rev) load(); };
  events.onerror = () => { events.close(); setTimeout(listen, 5000); };
}
listen();
</script>
