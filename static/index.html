<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Partstore</title>
<style>
:root { --paper:#f7f6f2; --ink:#17181a; --ink2:#5b6470; --line:#d9d7cf; --have:#dff3df; --have2:#8fcf8f; --none:#ebe9e3; --accent:#d8641f; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.35 system-ui, sans-serif; display:flex; flex-direction:column; }
header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:18px; margin:0 12px 0 0; font-weight:600; }
.tab { padding:6px 10px; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; }
.tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.spacer { flex:1; }
button { font:inherit; padding:6px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
button:hover { border-color:var(--ink2); }
#status { color:var(--ink2); font-size:13px; }
/* the grid is the only thing that scrolls: header and legend stay put, the length row sticks to the top and the size column to the left */
main { flex:1; min-height:0; overflow:auto; padding:0 14px 14px; }
thead th { position:sticky; top:0; background:var(--paper); z-index:3; padding-top:8px; }
th.row { position:sticky; left:0; background:var(--paper); z-index:2; vertical-align:middle; padding-right:24px; }
th.row .rowctl { position:absolute; right:3px; bottom:3px; margin:0; padding:0 4px; border:0; background:transparent; font:inherit; line-height:1; z-index:3; cursor:pointer; }
thead th:first-child { left:0; z-index:4; }
table { border-collapse:separate; border-spacing:3px; }
th { font-weight:600; font-size:13px; color:var(--ink2); padding:2px 4px; white-space:nowrap; text-align:center; vertical-align:bottom; }
th.row { text-align:right; font-size:15px; color:var(--ink); }
th.row .sz { display:inline-block; text-align:center; }   /* the size and its diameter centred on each other, the pair right-aligned */
th.row .dec { display:block; font-size:11px; font-weight:400; color:var(--ink2); }
th .dec { font-weight:400; color:var(--ink2); }
th .del { color:var(--ink2); cursor:pointer; margin-left:4px; font-weight:400; }
th .del:hover { color:var(--accent); }
td.cell { background:var(--none); border-radius:5px; padding:5px 6px 24px; min-width:150px; vertical-align:top; position:relative; }
td.cell.have { background:var(--have); box-shadow:inset 0 0 0 1.5px var(--have2); }
td.washer { background:var(--none); }
.icons { display:flex; gap:4px; flex-wrap:wrap; }
.icons.dense .ic { width:32px; height:32px; }
.ic { position:relative; }
.ic .badge { position:absolute; right:-3px; bottom:-3px; background:var(--accent); color:#fff; font-size:9px; line-height:1; padding:2px 3px; border-radius:6px; font-weight:600; pointer-events:none; }
.ic .badge.bin { background:#2f6db5; }
.ic .badge.mixed { background:var(--ink2); }
#pop .locbtn { font-size:11px; padding:1px 5px; margin-left:auto; border-radius:8px; }
#pop .varbtn { font-size:11px; padding:1px 5px; border-radius:8px; }
#pop .finbtn { display:block; font-size:11px; padding:1px 6px; margin:1px 0 2px 22px; border-radius:8px; color:var(--ink2); }
#pop .locbtn.set { background:var(--accent); color:#fff; border-color:var(--accent); }
#pop .locbtn.bin { background:#2f6db5; color:#fff; border-color:#2f6db5; }
#pop .loc { display:flex; align-items:center; gap:8px; }
.ic.hasinfo::after { content:''; position:absolute; left:2px; top:2px; width:6px; height:6px; border-radius:3px; background:var(--ink2); }
.more { width:28px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink2); cursor:pointer; border-radius:3px; font-weight:600; }
.more:hover { background:#fff; color:var(--ink); }
#pop { position:fixed; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; box-shadow:0 6px 24px rgba(0,0,0,.16); display:none; z-index:20; max-height:80vh; overflow:auto; width:300px; font-size:14px; }
#pop h3 { margin:0 0 6px; font-size:14px; }
#pop h4 { margin:8px 0 3px; font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em; }
#pop label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
#pop label svg { width:24px; height:24px; }
#pop .sub { margin-left:22px; }
#pop input[type=text] { width:100%; box-sizing:border-box; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
#pop .row { display:flex; gap:8px; margin-top:10px; }
#pop .note { font-size:12px; color:var(--ink2); }
.ic { width:44px; height:44px; opacity:.28; cursor:pointer; border-radius:3px; }
.ic.on { opacity:1; }
.ic:hover { outline:1.5px solid var(--accent); }
.ic svg { width:100%; height:100%; display:block; }
.meta { position:absolute; left:6px; right:6px; bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink2); min-height:14px; }
.drawer { cursor:pointer; padding:0 3px; border-radius:3px; }
.drawer:hover { background:#fff; }
.drawer.set { color:var(--ink); font-weight:600; }
.print { cursor:pointer; opacity:.55; }
.rowprint { margin-left:6px; font-weight:400; }
.print:hover { opacity:1; color:var(--accent); }
td.cell:not(.have) .print, .card:not(.have) .print { visibility:hidden; }
.legend { display:flex; gap:14px; flex-wrap:wrap; padding:8px 14px; font-size:13px; color:var(--ink2); border-bottom:1px solid var(--line); }
.legend span { display:inline-flex; align-items:center; gap:4px; }
.legend svg { width:30px; height:30px; }
#types { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:5; max-height:80vh; overflow:auto; }
#types h3 { margin:6px 0 4px; font-size:13px; color:var(--ink2); }
#helper { position:fixed; top:56px; right:14px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; z-index:5; width:340px; font-size:14px; }
#helper label { display:block; margin:6px 0 2px; color:var(--ink2); font-size:12px; }
#helper input, #helper select { width:100%; box-sizing:border-box; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
#helper .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
#helper .note { font-size:12px; color:var(--ink2); margin:4px 0 6px; }
#helper .msg { font-size:12px; color:var(--ink2); margin-top:6px; min-height:16px; }
#types label { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
#types label svg { width:24px; height:24px; }
/* phone layout: one thread size at a time, as a vertical list of cards */
.mobile header { padding:8px 10px; gap:6px; }
.mobile header h1 { display:none; }
.mobile #tabs { display:none; }
.mobile #pageSel { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; max-width:48vw; }
.mobile .legend { display:none; }
.mobile main { padding:8px 10px 60px; }
.mrow { display:flex; gap:8px; align-items:center; margin:4px 0 10px; }
.mrow select { flex:1; font:inherit; font-size:17px; padding:8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
.mrow button { padding:8px 10px; }
.card { background:var(--none); border-radius:8px; padding:8px 10px 6px; margin:0 0 8px; }
.card.have { background:var(--have); box-shadow:inset 0 0 0 1.5px var(--have2); }
.card .ttl { font-weight:600; margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline; }
.card .ttl .dec { font-weight:400; color:var(--ink2); font-size:13px; }
.card .icons { gap:6px; }
.card .ic { width:48px; height:48px; }
.card .meta { position:static; margin-top:6px; font-size:13px; }
.mobile #types, .mobile #helper { top:8px; right:8px; left:8px; width:auto; max-height:85vh; }
#pageSel { display:none; }
.mobile #addLen, .mobile #addRow { display:none; }
/* the stack never takes the pointer: if it grows up under the cursor the ⎙ would get mouseleave and the preview would flicker */
#preview { position:fixed; right:14px; bottom:14px; background:#fff; border:1px solid var(--line); padding:6px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.12); display:none; pointer-events:none; max-height:calc(100vh - 28px); overflow:hidden; }
#preview img { display:block; width:430px; max-width:calc(100vw - 42px); height:auto; }   /* every label at one scale, 8.6 px per mm (50 mm = 430 px; showPreview sets the width of other lengths) */
#preview img + img { margin-top:6px; }
/* list pages: one line per label */
table.list { border-spacing:0 4px; }
table.list th { position:static; text-align:left; padding:2px 6px; }
table.list td { padding:2px 6px; vertical-align:middle; background:var(--none); }
table.list tr.have td { background:var(--have); }
table.list td:first-child { border-radius:6px 0 0 6px; } table.list td:last-child { border-radius:0 6px 6px 0; }
table.list input[type=text] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; width:100%; box-sizing:border-box; }
table.list td.txt { min-width:220px; } table.list td.det { min-width:140px; }
table.list .gl { width:40px; height:40px; padding:2px; background:#fff; border:1px solid var(--line); border-radius:4px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink2); }
table.list .gl svg { width:34px; height:34px; }
table.list img.lpv { display:block; width:215px; height:auto; background:#fff; border:1px solid var(--line); }
table.list .drawer { white-space:nowrap; }
#pop .glyphs { display:grid; grid-template-columns:repeat(6, 44px); gap:4px; }
#pop .glyphs .g { width:44px; height:44px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
#pop .glyphs .g.on { outline:2px solid var(--accent); }
#pop .glyphs .g svg { width:38px; height:38px; }
#pop.wide { width:330px; }
.mobile table.list td.det, .mobile table.list td.pv, .mobile table.list th.det, .mobile table.list th.pv { display:none; }
</style>
</head>
<body>
<header>
  <h1>Partstore</h1>
  <div id="tabs"></div>
  <select id="pageSel"></select>
  <span class="spacer"></span>
  <button id="typesBtn">Types…</button>
  <button id="addRow">Add row…</button>
  <button id="addLen">Add length…</button>
  <button id="addLine">Add line</button>
  <button id="printSel" title="labels for the ticked lines">PDF: selected</button>
  <button id="addPage" title="a new page of free-form labels (connectors, test leads, …)">Add list page…</button>
  <button id="printDrawers">PDF: drawers…</button>
  <button id="printBins" title="labels for the bins">PDF: bins…</button>
  <button id="printNew">PDF: unprinted</button>
  <button id="printAll">PDF: all</button>
  <button id="markPrinted">Mark all printed</button>
  <button id="helperBtn" title="printer queues for direct printing">Printer…</button>
  <button type="button" id="cabinetBtn" title="drawer map for this page">Cabinet</button>
  <span id="status"></span>
</header>
<div class="legend" id="legend"></div>
<main>
  <div id="grid"></div>
</main>
<div id="preview"></div>
<div id="types"></div>
<div id="helper"></div>
<div id="pop"></div>
<script src="/model.js"></script>
<script src="/print.js"></script>
<script>
let data, icons, printed = {}, pageId, saveTimer;
const $ = s => document.querySelector(s);
function lengthText(page, len) {
  if (page.units === 'mm') return `${+len}mm`;
  const whole = Math.floor(len + 1e-9), frac = +(len - whole).toFixed(6);
  let f = '';
  if (frac) { for (const d of [2, 4, 8, 16, 32, 64]) { const n = frac * d; if (Math.abs(n - Math.round(n)) < 1e-6) { f = `${Math.round(n)}/${d}`; break; } } if (!f) f = String(frac).replace(/^0/, ''); }
  return (whole ? (f ? `${whole}-${f}` : String(whole)) : f) + '″';
}
function lengths(page) {
  if (!page.lengths) return [];
  const L = page.lengths, out = new Set();
  for (let x = L.start; x <= L.stop + 1e-9; x = +(x + L.step).toFixed(6)) out.add(+x.toFixed(6));
  for (const e of L.extra || []) out.add(+e);
  for (const s of L.skip || []) out.delete(+s);
  return [...out].sort((a, b) => a - b);
}
const page = () => data.pages.find(p => p.id === pageId);
function status(t) { $('#status').textContent = t; }
// undo: every save pushes the state it replaces; ⌘Z / Ctrl+Z (outside text fields) puts it back
let lastSaved = null; const undoStack = [];
function save() {
  if (lastSaved !== null) { undoStack.push(lastSaved); if (undoStack.length > 30) undoStack.shift(); lastSaved = null; }
  clearTimeout(saveTimer); status('saving…');
  saveTimer = setTimeout(async () => {
    saveTimer = null;   // the pending edit is on its way; reloads announced from elsewhere are allowed again once it lands
    const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (r.status === 409) { data = (await r.json()).data; render(); status('reloaded'); alert('The data had changed on the server (another tab, or an update). Reloaded it — please redo your last change.'); return; }
    if (r.ok) { data.rev = (await r.json()).rev; lastSaved = JSON.stringify(data); status('saved'); refreshPreviews(); } else { status('save failed'); alert('Save failed'); }
  }, 400);
}
function undo() {
  if (!undoStack.length) return status('nothing to undo');
  const prev = JSON.parse(undoStack.pop()); prev.rev = data.rev; data = prev; lastSaved = null;
  clearTimeout(saveTimer); status('saving…');
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (r.ok) { data.rev = (await r.json()).rev; lastSaved = JSON.stringify(data); status('undone'); } else { status('undo failed'); reload(); }
  }, 50);
  render();
}
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/^(input|textarea|select)$/i.test(e.target.tagName)) { e.preventDefault(); undo(); } });
function cell(key) { const p = page(); return p.cells[key] || (p.cells[key] = { types: [] }); }
const ghosts = {};   // cell key -> extra variants unticked this session; they stay visible (greyed) until re-ticked or the page reloads
function toggle(key, type) {
  const c = cell(key); const i = c.types.indexOf(type);
  if (i >= 0) { c.types.splice(i, 1); (ghosts[key] = ghosts[key] || new Set()).add(type); } else { c.types.push(type); ghosts[key]?.delete(type); }
  save(); render();
}
// locations: a drawer half ("12", "12R", "12F") or a bin ("B3"); each of a cell, a head type and a drive+material of a head
// can have its own primary location plus overflow locations, the most specific one winning (see model.js)
const halfText = h => h === 'back' ? 'rear' : h === 'front' ? 'front' : '';
// summary of what is set on an object holding loc/overflow: "drawer 12 rear +B3", "bin B2", or the fallback text
function locSummary(o, fallback = '') {
  const l = M.locOf(o), over = M.overflowOf(o), home = page().cabinet;
  return (l ? M.locLong(l, home) : fallback) + (over.length ? ' +' + over.map(x => M.locText(x, home)).join(',') : '');
}
// the cabinet a page's bare drawer numbers refer to; a list page without one needs the prefix (I, M, W) in its locations
const cabHint = () => page().cabinet ? `${M.cabinetById(page().cabinet).title.replace(/ screws$/, '')} cabinet; I/M/W prefix for another, e.g. M12R` : 'this page has no cabinet: prefix drawers with I, M or W, e.g. W12R';
// the editor: primary and overflow locations of `target` (a cell, a head type's detail, or one drive+material's item)
function openLoc(key, target, title, x, y, back) {
  $('#pop').innerHTML = `<h3>Location · ${title}</h3>
    <h4>Primary</h4><input type="text" id="popLoc" placeholder="${target === page().cells?.[key] || M.isList(page()) ? 'e.g. 12, 12R, 12F or B3' : 'blank = as the level above; e.g. 12R or B3'}" value="${M.locText(M.locOf(target), page().cabinet)}">
    <h4>Overflow</h4><input type="text" id="popOver" placeholder="e.g. B2, 13F" value="${M.overflowOf(target).map(x => M.locText(x, page().cabinet)).join(', ')}">
    <div class="note">Drawers: number, then R (rear) or F (front) if divided; bare numbers are the ${cabHint()}. Bins: B and a number for a loose bin, a box's letter and number (A3) for a bin in a box. Overflow: a list.</div>
    <div class="row"><button type="button" id="popGo">Save</button><button type="button" id="popClose">Cancel</button></div>`;
  const done = () => { closePop(); if (back) back(); };
  $('#popGo').onclick = () => {
    const prim = M.parseLoc($('#popLoc').value), over = M.parseLocs($('#popOver').value);
    if (prim === undefined || over.some(l => l === undefined)) return alert('Could not read a location. Use 12, 12R, 12F, M12R or B3.');
    if (!page().cabinet && [prim, ...over].some(l => l && l.kind === 'drawer' && !l.cabinet)) return alert('This page has no cabinet of its own: prefix drawer numbers with I, M or W (e.g. W12R).');
    for (const l of [prim, ...over]) if (l && l.cabinet === page().cabinet) delete l.cabinet;   // the page's own cabinet stays implicit
    delete target.drawer; delete target.half;   // the old fields
    if (prim) target.loc = prim; else delete target.loc;
    if (over.length) target.overflow = over; else delete target.overflow;
    save(); render(); done();
  };
  $('#popClose').onclick = done; placePop(x, y);
  $('#popLoc').focus();
  $('#pop').querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') $('#popGo').click(); });
}
// the per-type badge on an icon: its own location, "…" when its drives/materials are split over locations, "+" for overflow
function typeBadge(info) {
  const l = M.locOf(info), over = M.overflowOf(info), items = Object.values(info.items || {}).filter(it => M.locOf(it) || M.overflowOf(it).length);
  if (!l && !over.length && !items.length) return null;
  const b = document.createElement('span'); b.className = 'badge' + (l?.kind === 'bin' ? ' bin' : !l ? ' mixed' : '');
  b.textContent = (l ? M.locText(l, page().cabinet) : '…') + (over.length ? '+' : '');
  return b;
}
// a variant created on the page may not be in the icon set yet: fetch it before drawing
async function ensureIcon(t) { if (icons.svg[t]) return; try { const j = await (await fetch(`/api/icon?name=${encodeURIComponent(t)}`)).json(); icons.svg[t] = j.svg; icons.labels[t] = j.label; } catch (e) {} }
function iconEl(type, on, key) {
  const c = page().cells[key] || {}, info = (c.detail || {})[type] || {};
  const d = document.createElement('div'); d.className = 'ic' + (on ? ' on' : '') + (on && (info.drives || info.materials) ? ' hasinfo' : ''); d.title = iconLabel(type) + (on ? ' — right-click / long-press for tip, washers, drive, material, location' : '');
  d.innerHTML = iconSvg(type); d.onclick = () => toggle(key, type);
  if (on) { const b = typeBadge(info); if (b) d.appendChild(b); }
  d.oncontextmenu = e => { e.preventDefault(); if (on) openDetail(key, type, e.clientX, e.clientY); };
  return d;
}
function shownTypes(c, types, universe, key) {   // the column's own types plus any other variants ticked (or just unticked) in this cell, in shape order
  const extra = [...(c.types || []), ...(key && ghosts[key] ? [...ghosts[key]] : [])].filter((t, i, a) => a.indexOf(t) === i && !types.includes(t) && (!universe || universe.includes(shapeOf(t))));
  if (!universe) return [...types, ...extra];
  return [...types, ...extra.sort((a, b) => universe.indexOf(shapeOf(a)) - universe.indexOf(shapeOf(b)) || a.localeCompare(b))];
}
function cellTd(key, types, extraClass = '', universe = null) {
  const c = page().cells[key] || { types: [] };
  const td = document.createElement('td'); td.className = 'cell ' + extraClass + (c.types.length ? ' have' : '');
  const shown = universe ? shownTypes(c, types, universe, key) : types;
  const ic = document.createElement('div'); ic.className = 'icons' + (shown.length + (universe ? 1 : 0) > 9 ? ' dense' : '');
  for (const t of shown) ic.appendChild(iconEl(t, c.types.includes(t), key));
  if (universe && universe.some(sh => !shown.includes(defVariant(page(), sh)))) { const m = document.createElement('div'); m.className = 'more'; m.textContent = '…'; m.title = 'other head shapes'; m.onclick = e => openMore(key, universe, e.clientX, e.clientY); ic.appendChild(m); }
  td.appendChild(ic);
  const meta = document.createElement('div'); meta.className = 'meta';
  const dr = document.createElement('span'); dr.className = 'drawer' + (M.locOf(c) ? ' set' : ''); dr.textContent = locSummary(c, 'location?'); dr.title = 'where this cell lives (a head type or a drive+material can override it: right-click the icon)'; dr.onclick = e => openLoc(key, cell(key), cellTextClient(page(), key), e.clientX, e.clientY);
  const pr = document.createElement('span'); pr.className = 'print'; pr.textContent = '⎙'; pr.title = 'PDF for this label'; pr.onclick = e => printCell(key, e.clientX, e.clientY);
  pr.onmouseenter = () => showPreview(key); pr.onmouseleave = hidePreview;
  meta.appendChild(dr); meta.appendChild(pr); td.appendChild(meta);
  return td;
}
const isMobile = () => window.matchMedia('(max-width: 720px)').matches;
let mobileRow = null;
window.addEventListener('resize', () => { if (data) render(); });
function render() {
  const p = page(), lens = lengths(p);
  document.body.classList.toggle('mobile', isMobile());
  $('#tabs').innerHTML = data.pages.map(x => `<span class="tab${x.id === pageId ? ' on' : ''}" data-id="${x.id}">${x.title}</span>`).join(' ');

  const cl = M.locOf(c); if (cl && !M.locOf(t) && !M.locOf(t.detail[type])) t.detail[type].loc = cl;   // the head keeps its old cell's location

  save(); closePop(); render(); status(`${iconLabel(type)} moved to ${q.title}`);
}
// "Steel, zinc" for a material key, plain or with a finish
function matName(mats, key) { const [b, f] = key.split('-'); const m = mats.find(x => x[0] === b); if (!m) return key; if (!f) return m[1]; const fin = (m[2] || []).find(x => x[0] === f); return fin ? `${m[1]}, ${fin[1]}` : key; }
// per-head detail: own drawer, drive types, materials per drive (washers and nuts: materials only)
function openDetail(key, type, x, y) {
  const c = cell(key), p = page(); c.detail = c.detail || {}; const info = c.detail[type] = c.detail[type] || {};
  const v = vParse(type), isHead = HEAD_SHAPES.includes(v.shape), isWasher = key.split('|')[1].endsWith('washer');
  const mats = isWasher ? MAT_WASHER : MAT_SCREW, fixed = isHead ? FIXED_DRIVE[v.shape] : undefined;
  const drives = isHead && fixed === undefined ? (DRIVES_FOR[v.shape] || DRIVES) : (fixed && fixed !== 'none' ? [[fixed, DRIVES.find(d => d[0] === fixed)[1] + ' (always)']] : []);
  // one row per material ("plain"), and for the metals a fold-out list of finishes, each its own tick
  const matList = (drive) => {
    const list = (drive ? (info.drives || {})[drive] : info.materials) || [];
    const row = (m, l, cls = '') => { const on = list.includes(m); return `<label class="${cls}"><input type="checkbox" data-drive="${drive}" data-m="${m}" ${on ? 'checked' : ''}>${l}${on ? locBtn(itemOf(drive, m), drive, m) : ''}</label>`; };
    return `<div class="sub">` + mats.map(([m, l, fins]) => {
      if (!fins.length) return row(m, l);
      const open = openFin.has(drive + '|' + m) || fins.some(([f]) => list.includes(`${m}-${f}`));
      return row(m, `${l}, plain`) + `<button type="button" class="finbtn" data-fin="${drive}|${m}">${l} finishes ${open ? '▾' : '▸'}</button>` +
        (open ? `<div class="sub">` + fins.map(([f, fl]) => row(`${m}-${f}`, `${l}, ${fl}`)).join('') + `</div>` : '');
    }).join('') + `</div>`;
  };
  const locBtn = (o, d, m) => `<button type="button" class="locbtn${M.locOf(o) ? (M.locOf(o).kind === 'bin' ? ' bin' : ' set') : ''}" data-drive="${d}" data-m="${m}" title="location of this drive + material">${locSummary(o, '') || 'location'}</button>`;
  const itemOf = (d, m) => ((info.items || {})[`${d}|${m}`] || {});
  let h = `<h3>${iconSvg(type)} ${iconLabel(type)} · ${cellTextClient(p, key)}</h3>`;
  if (isHead && !WHOLE.includes(v.shape)) {
    h += `<h4>Tip</h4><label><input type="radio" name="tip" value="blunt" ${!v.pointed ? 'checked' : ''}>Blunt</label><label><input type="radio" name="tip" value="pointed" ${v.pointed ? 'checked' : ''}>Pointed</label>
      <label><input type="checkbox" id="popCut" ${v.cutting ? 'checked' : ''}>Cutting tip (${v.pointed ? 'self-drilling' : 'thread-forming'})</label>
      <h4>Captive washer</h4>` + [['k', 'Countersunk (finishing cup)'], ['f', 'Flat'], ['s', 'Split lock'], ['e', 'External tooth'], ['i', 'Internal tooth']].map(([c, l]) => `<label><input type="checkbox" class="popW" value="${c}" ${v.washers.includes(c) ? 'checked' : ''}>${l}</label>`).join('') +
      `<div class="note">Changing these converts this head. <button type="button" id="popVar" class="varbtn">Add another variant…</button> keeps it and adds a second one (same drives and materials) with a different tip or washers. A different drive, material or finish is just another tick below.</div>`;
  }
  h += `<h4>Location</h4><div class="loc"><span>${locSummary(info, '') || `as the cell (${locSummary(c, 'unset')})`}</span>${locBtn(info, '', '')}</div>`;
  // a wood screw that turns out to be a sheet metal screw (or the reverse): move this head, with its detail, to the same
  // size and length on the other page
  const others = isHead ? data.pages.filter(x => x !== p && ['wood', 'tapping'].includes(x.class) && ['wood', 'tapping'].includes(p.class)) : [];
  if (others.length) h += `<h4>Move to</h4>` + others.map(x => `<button type="button" class="varbtn movebtn" data-page="${x.id}">${x.title}</button>`).join(' ');
  if (drives.length) {

    h += `<h4>Drive</h4>` + drives.map(([d, l]) => `<label><input type="checkbox" data-drive="${d}" ${(info.drives || {})[d] ? 'checked' : ''} ${fixed ? 'disabled checked' : ''}>${l}${(info.drives || {})[d] && !info.drives[d].length ? locBtn(itemOf(d, ''), d, '') : ''}</label>` + ((info.drives || {})[d] || fixed ? `<div class="note sub">materials</div>` + matList(d) : '')).join('');
  } else if (isHead && fixed === 'none') h += `<h4>Drive</h4><div class="note">none</div>` + `<h4>Materials</h4>` + matList('');
  else h += `<h4>Materials</h4>` + matList('');
  h += `<div class="row"><button type="button" id="popClose">Close</button></div>`;
  $('#pop').innerHTML = h;
  if (fixed && fixed !== 'none') { info.drives = info.drives || {}; info.drives[fixed] = info.drives[fixed] || []; }
  const here = () => openDetail(key, type, parseInt($('#pop').style.left), parseInt($('#pop').style.top));
  // tip / cutting / washers rename the variant: its detail moves with it; a variant that already exists in the cell is refused
  const revariant = () => {
    const nv = { shape: v.shape, pointed: $('#pop input[name=tip]:checked')?.value === 'pointed', cutting: $('#popCut')?.checked, washers: [...$('#pop').querySelectorAll('.popW:checked')].map(i => i.value) };
    const nk = vKey(nv); if (nk === type) return;
    if (c.types.includes(nk)) { alert(`${iconLabel(nk)} is already in this cell.`); return here(); }
    c.types[c.types.indexOf(type)] = nk; c.detail[nk] = info; delete c.detail[type];
    save(); ensureIcon(nk).then(() => { render(); openDetail(key, nk, parseInt($('#pop').style.left), parseInt($('#pop').style.top)); });
  };
  $('#pop').querySelectorAll('input[name=tip], #popCut, .popW').forEach(i => i.onchange = revariant);
  if ($('#popVar')) $('#popVar').onclick = e => openVariant(key, type, e.clientX, e.clientY);
  $('#pop').querySelectorAll('.locbtn').forEach(b => b.onclick = e => {
    e.preventDefault();
    const d = b.dataset.drive, m = b.dataset.m, what = `${iconLabel(type)} · ${cellTextClient(p, key)}`;
    if (!d && !m) return openLoc(key, info, what, e.clientX, e.clientY, here);
    info.items = info.items || {}; const it = info.items[`${d}|${m}`] = info.items[`${d}|${m}`] || {};
    const mat = matName(mats, m), drv = ([...(DRIVES_FOR[v.shape] || []), ...DRIVES].find(x => x[0] === d) || [])[1] || '';
    openLoc(key, it, `${what} · ${[drv, mat].filter(Boolean).join(', ')}`, e.clientX, e.clientY, () => { if (!Object.keys(it).length) delete info.items[`${d}|${m}`]; here(); });
  });
  $('#pop').querySelectorAll('.finbtn').forEach(b => b.onclick = () => { const k = b.dataset.fin; if (openFin.has(k)) openFin.delete(k); else openFin.add(k); here(); });
  $('#pop').querySelectorAll('.movebtn').forEach(b => b.onclick = () => moveHead(key, type, b.dataset.page));
  $('#pop').querySelectorAll('input[type=checkbox]:not(#popCut):not(.popW)').forEach(i => i.onchange = () => {
    if (i.dataset.m !== undefined) {   // a material
      const list = i.dataset.drive ? (info.drives = info.drives || {}, info.drives[i.dataset.drive] = info.drives[i.dataset.drive] || []) : (info.materials = info.materials || []);
      const j = list.indexOf(i.dataset.m); if (i.checked && j < 0) list.push(i.dataset.m); if (!i.checked && j >= 0) list.splice(j, 1);
    } else {   // a drive
      info.drives = info.drives || {}; if (i.checked) info.drives[i.dataset.drive] = info.drives[i.dataset.drive] || []; else delete info.drives[i.dataset.drive];
    }
    save(); here(); render();
  });
  $('#popClose').onclick = closePop; placePop(x, y);
}
// a second variant of a head in the same cell: e.g. the self-drilling version next to the plain one. Drives and materials
// are copied from the head it is made from; locations are not.
function openVariant(key, type, x, y) {
  const c = cell(key), v = vParse(type), src = (c.detail || {})[type] || {};
  $('#pop').innerHTML = `<h3>${iconSvg(type)} Another variant of ${iconLabel(v.shape)} · ${cellTextClient(page(), key)}</h3>
    <h4>Tip</h4><label><input type="radio" name="vtip" value="blunt" ${!v.pointed ? 'checked' : ''}>Blunt</label><label><input type="radio" name="vtip" value="pointed" ${v.pointed ? 'checked' : ''}>Pointed</label>
    <label><input type="checkbox" id="vCut" ${v.cutting ? 'checked' : ''}>Cutting tip</label>
    <h4>Captive washer</h4>` + [['k', 'Countersunk (finishing cup)'], ['f', 'Flat'], ['s', 'Split lock'], ['e', 'External tooth'], ['i', 'Internal tooth']].map(([cd, l]) => `<label><input type="checkbox" class="vW" value="${cd}" ${v.washers.includes(cd) ? 'checked' : ''}>${l}</label>`).join('') +
    `<div class="row"><button type="button" id="popGo">Add</button><button type="button" id="popClose">Cancel</button></div>`;
  $('#popGo').onclick = () => {
    const nk = vKey({ shape: v.shape, pointed: $('#pop input[name=vtip]:checked')?.value === 'pointed', cutting: $('#vCut').checked, washers: [...$('#pop').querySelectorAll('.vW:checked')].map(i => i.value) });
    if (c.types.includes(nk)) return alert(`${iconLabel(nk)} is already in this cell.`);
    c.types.push(nk); c.detail = c.detail || {};
    c.detail[nk] = { ...(src.drives ? { drives: JSON.parse(JSON.stringify(src.drives)) } : {}), ...(src.materials ? { materials: [...src.materials] } : {}) };
    save(); ensureIcon(nk).then(() => { render(); openDetail(key, nk, x, y); });
  };

}
// which head / nut / washer types this page shows (types ticked in cells but hidden here still print)
// drive and material vocabularies for the per-head detail (right-click / long-press on a ticked icon)
const DRIVES = [['slotted', 'Slotted'], ['phillips', 'Phillips'], ['combo', 'Slotted + Phillips combo'], ['pozidriv', 'Pozidriv'], ['jis', 'JIS'], ['torx', 'Torx'], ['hex', 'Hex'], ['square', 'Square']];
const FIXED_DRIVE = { socket: 'hex', shoulder: 'hex', setscrew: 'hex', thumb: 'none' };   // by shape
// hex and hex washer heads: the external hex is implied; the choice is what recess, if any, is added to it
const HEX_DRIVES = [['hex', 'None'], ['slotted', 'Slotted'], ['phillips', 'Phillips'], ['jis', 'JIS']];
const DRIVES_FOR = { hex: HEX_DRIVES, hexwasher: HEX_DRIVES };   // shapes with their own drive list   // carriage bolts: usually none, but some carry a slot, so the normal list applies   // heads whose drive is a given
// materials: [key, name, finishes]; a finish is stored as `${material}-${finish}` (plain = the bare material key)
const MAT_SCREW = [
  ['steel', 'Steel', [['blackoxide', 'black oxide'], ['brass', 'brass plated'], ['bronze', 'bronze plated'], ['cadmium', 'cadmium'], ['chrome', 'chrome'], ['nickel', 'nickel'], ['galvanized', 'galvanized'], ['zinc', 'zinc'], ['zincyellow', 'zinc yellow chromate'], ['tin', 'TiN'], ['ceramic', 'ceramic (exterior)']]],
  ['stainless', 'Stainless steel', [['chrome', 'chrome'], ['blackoxide', 'black oxide'], ['zinc', 'zinc'], ['zincyellow', 'zinc yellow chromate'], ['ticn', 'TiCN']]],
  ['aluminum', 'Aluminum', [['anodized', 'anodized'], ['blackoxide', 'black oxide'], ['cadmium', 'cadmium'], ['chrome', 'chrome'], ['nickel', 'nickel'], ['tinzinc', 'tin zinc'], ['zinc', 'zinc'], ['zincyellow', 'zinc yellow chromate']]],
  ['brass', 'Brass', [['bronze', 'bronze plated'], ['chrome', 'chrome'], ['nickel', 'nickel'], ['tin', 'tin'], ['zinc', 'zinc'], ['gold', 'gold']]],
  ['nylon', 'Nylon', []], ['ptfe', 'PTFE', []], ['phenolic', 'Phenolic', []], ['pei', 'PEI (Ultem)', []], ['polycarbonate', 'Polycarbonate', []], ['plastic', 'Plastic, other', []]];
const MAT_WASHER = [...MAT_SCREW, ['fiber', 'Fiber', []], ['copper', 'Copper', []], ['bronze', 'Bronze', []]];
const openFin = new Set();   // material rows whose finish list is unfolded in the detail popup
// hardware columns: [page list, cell key suffix, per row or per diameter, label]
const HW = [['locknuts', 'locknut', 'row', 'Lock Nut'], ['nuts', 'nut', 'row', 'Nut'], ['lockwashers', 'lockwasher', 'dia', 'Lock Washer'], ['washers', 'washer', 'dia', 'Washer']];
const GROUPS = [['heads', 'Heads', HEAD_SHAPES], ['nuts', 'Nuts', ['nut', 'thin', 'square', 'pressfit', 'wing', 'capnut']], ['locknuts', 'Lock nuts', ['nylock', 'toothednut', 'serratedflange', 'lock']], ['washers', 'Washers', ['washer', 'undersized', 'fender', 'thinw', 'cup', 'sleeved']], ['lockwashers', 'Lock washers', ['split', 'spring', 'inttooth', 'toothed', 'inextooth']]];
function renderTypes() {
  const p = page();
  $('#types').innerHTML = GROUPS.map(([k, title, all]) => `<h3>${title}</h3>` + all.map(t => { const sh = k === 'heads' ? defVariant(p, t) : t; return `<label><input type="checkbox" data-group="${k}" data-type="${t}" ${(p[k] || []).includes(t) ? 'checked' : ''}>${iconSvg(sh)}${iconLabel(sh)}</label>`; }).join('')).join('');
  $('#types').querySelectorAll('input').forEach(i => i.onchange = () => {
    p[i.dataset.group] = p[i.dataset.group] || []; const list = p[i.dataset.group], t = i.dataset.type;
    if (i.checked) { if (!list.includes(t)) list.push(t); list.sort((a, b) => GROUPS.find(g => g[0] === i.dataset.group)[2].indexOf(a) - GROUPS.find(g => g[0] === i.dataset.group)[2].indexOf(b)); }
    else p[i.dataset.group] = list.filter(x => x !== t);

}
$('#typesBtn').onclick = () => { const t = $('#types'); if (t.style.display === 'block') t.style.display = 'none'; else { renderTypes(); t.style.display = 'block'; } };
function renderHelper() {
  const h = HS.get(), q = queues(), sizes = M.labelSizes(data);
  $('#helper').innerHTML = `<b>Label printer</b><div class="note">One printer queue per label size in use (sizes are set per cabinet in the drawer map's Setup).</div>` +
    sizes.map(z => `<label>Printer queue for ${z.replace('x', ' × ')} mm labels</label><select class="hQ" data-tape="${z}"></select>`).join('') +
    `<div class="row"><button id="hTest" type="button">Refresh</button><label style="margin:0"><input type="checkbox" id="hDirect" style="width:auto" ${h.direct ? 'checked' : ''}> print directly instead of downloading</label></div>
    <div class="msg" id="hMsg"></div>
    <div class="row"><button id="hSave" type="button">Save</button><button id="hClose" type="button">Close</button></div>`;
  const sels = [...$('#helper').querySelectorAll('.hQ')];
  // the saved queues stay selectable while the helper is offline
  const fill = names => sels.forEach(sel => { const cur = sel.value || q[sel.dataset.tape] || '';
    sel.innerHTML = '<option value="">(none)</option>' + [...new Set([cur, ...names].filter(Boolean))].map(pn => `<option ${pn === cur ? 'selected' : ''}>${pn}</option>`).join(''); });
  const refresh = async () => {
    $('#hMsg').textContent = 'asking the server…';
    try { const j = await (await fetch('/api/print/status')).json(); fill(j.printers || []);
      $('#hMsg').textContent = j.online ? `helper ${j.version || ''} connected · print program: ${j.backend || 'NONE FOUND'} · ${(j.printers || []).length} printers`
        : 'the print helper is not connected (it runs on the PC with the label printer)';
    } catch (e) { $('#hMsg').textContent = 'no answer from the server: ' + e.message; }
  };
  fill([]); refresh();
  $('#hTest').onclick = refresh;
  $('#hSave').onclick = () => { HS.set({ queues: { ...q, ...Object.fromEntries(sels.map(sel => [sel.dataset.tape, sel.value])) }, direct: $('#hDirect').checked }); $('#hMsg').textContent = 'saved'; };
  $('#hClose').onclick = () => { $('#helper').style.display = 'none'; };
}
$('#helperBtn').onclick = () => { const t = $('#helper'); if (t.style.display === 'block') t.style.display = 'none'; else { renderHelper(); t.style.display = 'block'; } };
$('#cabinetBtn').onclick = () => window.open(`cabinet.html?page=${encodeURIComponent(pageId)}`, '_blank');
$('#printAll').onclick = () => printKeys('all');
$('#printDrawers').onclick = () => { const v = prompt(`Drawers to print: a list or ranges, R/F for one half of a divided drawer; bare numbers are the ${cabHint()}. e.g. 12-16, 20, 30R, M3-5`); if (v) printKeys(null, { drawers: v, page: pageId }); };
$('#printBins').onclick = () => { const v = prompt('Bins to print: a list or ranges, or "all". e.g. B1, B3-5, A2-4'); if (v) printKeys(null, { bins: v.trim().toLowerCase() === 'all' ? 'all' : v }); };
$('#printNew').onclick = () => printKeys('new');
$('#markPrinted').onclick = async () => {
  if (!confirm('Record every populated cell on this page as printed with its current text?')) return;
  const r = await fetch('/api/printed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: pageId, keys: 'all' }) });
  status(r.ok ? `${(await r.json()).marked} marked printed` : 'failed');
};
// every label the cell's ⎙ would print, one per location, stacked in print order (drawers, then bins, then no location)
function showPreview(key) {
  const slots = cellSlots(key).sort((a, b) => (a.slot.startsWith('D:') ? 0 : a.slot ? 1 : 2) - (b.slot.startsWith('D:') ? 0 : b.slot ? 1 : 2));
  const pv = $('#preview'); pv.innerHTML = '';
  for (const s of slots) { const img = document.createElement('img'); img.alt = s.label; img.onload = () => { img.style.width = `${Math.round(img.naturalWidth * 430 / 3543)}px`; }; img.src = `/api/preview.png?page=${encodeURIComponent(pageId)}&key=${encodeURIComponent(key)}&slot=${encodeURIComponent(s.slot)}&t=${Date.now()}`; pv.appendChild(img); }
  pv.style.display = 'block';
}
function hidePreview() { $('#preview').style.display = 'none'; }
async function reload() {
  const [d, ic] = await Promise.all([fetch('/api/data').then(r => r.json()), fetch('/api/icons').then(r => r.json())]);
  if (data && d.rev === data.rev) return;
  data = d; icons = ic; lastSaved = JSON.stringify(data); if (!pageId || !data.pages.some(p => p.id === pageId)) pageId = data.pages[0].id; render(); status('loaded');
}
// pick up changes made elsewhere: the server announces every save, and the tab also checks when it comes back into view
document.addEventListener('visibilitychange', () => { if (!document.hidden && !saveTimer) reload(); });
let events; function listen() {
  try { events = new EventSource('/api/events'); } catch (e) { return; }
  events.onmessage = e => { if (data && +e.data !== data.rev && !saveTimer) reload(); };
  events.onerror = () => { events.close(); setTimeout(listen, 5000); };   // reconnect after the server restarts
}
listen();
reload();
</script>
